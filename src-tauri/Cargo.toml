[package]
name = "desktop-mascot"
version = "0.1.0"
description = "Desktop Mascot Companion for Bloub"
authors = ["Rmie"]
edition = "2021"

[lib]
name = "desktop_mascot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "desktop-mascot"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
